<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        .container div{
            border: 2px solid tomato;
            width: 200px;
            height: 30%;
            font-size: 3em;
        }

        .container{
            display: flex;
        }

        .box {
            border: 4px solid blue;
            font-size: 2em;
            height: 45%;
            width: 200px;
            

        }

        .box-container{
            display: flex;
            margin: 20px;
           
        }

        .card{
            border: 2px solid brown;
            width: 70px;
            height: 70px;
            background-color: aqua;
            font-size: 2em;
            margin: 20px;
            
        }

        .card-container{
            display: flex;
            gap: 20px;
            margin: 20px;
            justify-content: space-between;
        }

        .space{
            border: 1px solid black;
            width: 70px;
            height: 70px;
            background-color: aqua;
            font-size: 2em;
            
        }

        .space-container{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
    </style>
    <link rel="stylesheet" href="styles/nav.css">
</head>
