<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table{
            border-collapse: collapse;
        }

        td, th{
            border: 1px solid black;
            padding: 10px 35px;
        }

        tfoot{
            text-align: center;
        }
    </style>
</head>
<body>
    <header>

    </header>

    <main>
        <section>
            <table>
                <caption>Random survey</caption>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Age</th>
                    </tr>

                </thead>
                <tbody>
                    <tr>
                        <td>Ratul</td>
                        <td>9</td>
                        <td>18</td>

                    </tr>

                    <tr>
                        <td>Jarin</td>
                        <td>9</td>
                        <td>17</td>

                    </tr>

                    <tr>
                        <td>joy</td>
                        <td>5</td>
                        <td>9</td>
                    </tr>
                    <tfoot>
                        <td colspan="3">sum of age is 44</td>
                    </tfoot>
                </tbody>
            </table>
        </section>
    </main>
    
</body>
</html>
